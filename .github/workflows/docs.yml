name: Build and Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      # Триггерим сборку при изменении любого проекта, решения или документации
      - 'sources/Domain/**'
      - 'sources/API/**'
      - 'docs/**'
      - 'dics/**'
      - '.cspell.json'
      - '.github/workflows/docs.yml'
      - 'package.json'  # триггерим при изменении зависимостей

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Принудительно пересобрать даже если файлы не менялись'
        required: false
        default: 'false'
        type: boolean

# Это необходимо подключить при работе в большой команде при одновременном merge нескольких PR
#concurrency:
#  group: "pages"
#  cancel-in-progress: true

jobs:
  build-and-deploy-docs:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Установить зависимости из package.json
      - name: Install Node dependencies
        run: npm install

      - name: Run spellcheck
        run: |
          npx cspell lint \
            --config .cspell.json \
            --no-progress \
            --show-context \
            --show-suggestions

      - name: Generate Doxygen Documentation
        run: doxygen docs/Doxyfile

      - name: Convert .mmd files to SVG
        run: |
          mkdir -p docs/html/diagrams
          # 1. Создаем конфиг для обхода sandbox в CI
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json
          # 2. Ищем файлы
          shopt -s nullglob
          mmd_files=(docs/mmd/*.mmd)

          if [ ${#mmd_files[@]} -gt 0 ]; then
            echo "Найдено ${#mmd_files[@]} .mmd файлов. Начинаем конвертацию..."
            for file in "${mmd_files[@]}"; do
              filename=$(basename "$file" .mmd)
              echo "Обработка: $filename.mmd"
              # 3. ВАЖНО: добавлен флаг -p puppeteer-config.json
              npx @mermaid-js/mermaid-cli \
                -i "$file" \
                -o "docs/html/diagrams/$filename.svg" \
                -b transparent \
                -p puppeteer-config.json
            done
          else
            echo "Нет .mmd файлов для конвертации."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
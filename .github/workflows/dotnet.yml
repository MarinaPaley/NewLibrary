name: Build .NET
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        working-directory: .
        run: dotnet tool restore

      - name: Check formatting (CSharpier)
        working-directory: .
        run: dotnet csharpier check .

      - name: Restore dependencies
        working-directory: sources
        run: dotnet restore Library.slnx

      - name: Build
        working-directory: sources
        run: dotnet build Library.slnx --no-restore --configuration Release --verbosity normal

      - name: Test
        working-directory: sources
        run: dotnet test Library.slnx --no-build --configuration Release --verbosity normal
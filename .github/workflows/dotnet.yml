name: Build .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore tools
      working-directory: .
      run: dotnet tool restore

    - name: Check formatting
      working-directory: .
      run: dotnet csharpier . --check

    - name: Check code style
      working-directory: sources
      run: dotnet format --verify-no-changes

    - name: Restore dependencies
      working-directory: sources
      run: dotnet restore

    - name: Build
      working-directory: sources
      run: dotnet build --no-build --verbosity normal

    - name: Test
      working-directory: sources
      run: dotnet test Library.sln --no-build --verbosity normal